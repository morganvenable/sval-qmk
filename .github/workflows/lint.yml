name: PR Lint keyboards

# Svalboard-only. Validates the Svalboard keyboard definitions and targets;
# other keyboards inherited from QMK are not checked here. `qmk lint` is not
# used: it enforces QMK submission policy (license headers, no keyboard-level
# VIA/combo/tap-dance) that this fork intentionally does not follow.

permissions:
  contents: read

on:
  pull_request:
    paths:
    - 'keyboards/svalboard/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Disable safe.directory check
      run : git config --global --add safe.directory '*'

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: pip3 install -r requirements-dev.txt

    - name: Get changed files
      id: file_changes
      uses: tj-actions/changed-files@v47
      with:
        use_rest_api: true
        files: |
          keyboards/svalboard/**

    - name: Validate Svalboard keyboard definitions
      if: always()
      shell: 'bash {0}'
      run: |
        exit_code=0
        for KB in $(qmk list-keyboards | grep '^svalboard/'); do
          echo "validating ${KB}"
          qmk info -l --keyboard ${KB} > /dev/null || exit_code=$(($exit_code + 1))
        done
        exit $exit_code

    - name: Check text formatting
      if: always()
      shell: 'bash {0}'
      run: |
        FILES='${{ steps.file_changes.outputs.all_changed_files }}'
        # With no arguments the formatter would rewrite the whole tree.
        [[ -z "${FILES// }" ]] && exit 0
        qmk format-text $FILES || true
        exit_code=0
        for file in $FILES; do
          if [[ -f $file ]] && ! git diff --quiet $file; then
            echo "File '${file}' Requires Formatting"
            echo "::error file=${file}::Requires Formatting"
            exit_code=$(($exit_code + 1))
          fi
        done
        exit $exit_code

    - name: Reset git repo
      if: always()
      shell: 'bash {0}'
      run: |
        git reset --hard
        git clean -xfd

    - name: Verify Svalboard targets and aliases
      if: always()
      shell: 'bash {0}'
      run: |
        { qmk ci-validate-keyboard-targets; qmk ci-validate-aliases; } 2>&1 | tee ~/validate.txt
        ! grep -i 'svalboard' ~/validate.txt
