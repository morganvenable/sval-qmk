name: Durable settings fault tests
on:
  pull_request:
    paths:
      - 'keyboards/svalboard/storage/**'
      - 'util/durable_storage_test/**'
      - '.github/workflows/durable-storage.yml'
  push:
    paths:
      - 'keyboards/svalboard/storage/**'
      - 'util/durable_storage_test/**'
      - '.github/workflows/durable-storage.yml'
permissions:
  contents: read
jobs:
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash util/durable_storage_test/run.sh
