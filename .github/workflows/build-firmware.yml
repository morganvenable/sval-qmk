name: Build QMK Firmware

on:
  workflow_call:
    inputs:
      keyboard:
        required: true
        type: string
      keymap:
        required: true
        type: string
      side:
        required: true
        type: string
      # In-firmware updater (docs/updater.md, "Release signing"). With
      # updater true the firmware is a release updater build
      # (SVAL_UPDATER=yes SVAL_UPDATE_RELEASE=yes) carrying version_string,
      # and instead of publishing its .uf2 the job uploads the .uf2, the raw
      # image, the unsigned manifest and the ELF as the artifact
      # release-<name>; release.yml publishes them once the lint passes. With
      # updater false (the default) the job is what it always was.
      updater:
        required: false
        type: boolean
        default: false
      version_string:
        required: false
        type: string
        default: ''
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Checkout code - Non PR
      uses: actions/checkout@v4
      if: ${{ startsWith(github.ref, 'refs/tags') }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.ref }}
        fetch-depth: 0
        submodules: 'recursive'

    - name: Checkout code - PR
      uses: actions/checkout@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        submodules: 'recursive'

    - name: Get tag version
      if: ${{ startsWith(github.ref, 'refs/tags/')}}
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build firmware
      id: build_firmware
      env:
        UPDATER: ${{ inputs.updater }}
        VERSION_STRING: ${{ inputs.version_string }}
      run: |
        git config --global --add safe.directory '*'
        pip3 install --break-system-packages -r requirements.txt
        qmk setup -y
        if [ "$UPDATER" = "true" ]; then
          make ${{ inputs.keyboard }}/${{ inputs.side }}:${{ inputs.keymap }} \
            SVAL_UPDATER=yes SVAL_UPDATE_RELEASE=yes "SVAL_FW_VERSION_STRING=$VERSION_STRING"
        else
          make ${{ inputs.keyboard }}/${{ inputs.side }}:${{ inputs.keymap }}
        fi
      shell: bash

    - name: Calculate keyboard name
      id: keyboard_vars
      run: |
        KEYBOARD_NAME="${{ inputs.keyboard }}"
        KEYBOARD_NAME="${KEYBOARD_NAME//\//_}"
        echo "keyboard_name=$KEYBOARD_NAME" >> $GITHUB_ENV
        echo "keyboard_name=$KEYBOARD_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Updater image and unsigned manifest
      if: ${{ inputs.updater }}
      run: |
        NAME="${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}"
        mkdir -p updater-out
        # The commit's RAM code must not reach flash (plan R2).
        python3 -I keyboards/svalboard/tools/check_ram_funcs.py ".build/$NAME.elf"
        # No key in this job: the signing job signs (D29).
        python3 -I keyboards/svalboard/tools/make_update.py unsigned "$NAME.uf2" \
          --kb "${{ inputs.keyboard }}/${{ inputs.side }}" --keymap "${{ inputs.keymap }}" --release \
          --image-out "updater-out/$NAME.img" --manifest-out "updater-out/$NAME.manifest"
        cp ".build/$NAME.elf" "updater-out/$NAME.elf"
        cp "$NAME.uf2" "updater-out/${NAME}_${{ steps.get_version.outputs.VERSION }}.uf2"
        echo "release_name=$NAME" >> "$GITHUB_ENV"
      shell: bash

    - name: Upload updater image, manifest and ELF
      uses: actions/upload-artifact@v4
      if: ${{ inputs.updater }}
      with:
        name: release-${{ env.release_name }}
        path: updater-out/
        if-no-files-found: error

    - name: Add file to PR.
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2
        path: ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2

    - name: Move file into position (for tags only)
      id: move_file
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        FILE_NAME="${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}_${{ steps.get_version.outputs.VERSION }}.uf2"
        mv ${{ env.keyboard_name }}_${{ inputs.side }}_${{ inputs.keymap }}.uf2 "$FILE_NAME"
        echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Release
      uses: ncipollo/release-action@v1.11.2
      # Updater builds are published by release.yml after the lint.
      if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.updater }}
      with:
        allowUpdates: True
        # Every build job updates the same release; keep the title and notes
        # written after the first upload instead of resetting them.
        omitBodyDuringUpdate: True
        omitNameDuringUpdate: True
        # Dry-run tags (release.yml's version job) are always prereleases.
        prerelease: ${{ inputs.prerelease }}
        artifacts: "${{ steps.move_file.outputs.file_name }}"
