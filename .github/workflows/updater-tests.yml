name: Svalboard updater host tests

# Host tests for the in-firmware updater (util/updater_test/run.sh: the state
# machine, commit, relay, split link and tools under ASan and UBSan; no QMK
# build, no submodules). Runs only when updater files change; tag pushes do
# not run it (release.yml lints release builds itself).

permissions:
  contents: read

on:
  push:
    branches:
    - '**'
    paths:
    - 'keyboards/svalboard/updater/**'
    - 'keyboards/svalboard/split_pause.c'
    - 'keyboards/svalboard/split_pause.h'
    - 'keyboards/svalboard/config.h'
    - 'keyboards/svalboard/tools/make_update.py'
    - 'keyboards/svalboard/tools/sval_update.py'
    - 'keyboards/svalboard/tools/release_version.py'
    - 'keyboards/svalboard/tools/sval_update_TEST_ONLY.key'
    - 'tests/sval_updater/**'
    - 'util/updater_test/**'
    - '.github/workflows/updater-tests.yml'
  pull_request:
    paths:
    - 'keyboards/svalboard/updater/**'
    - 'keyboards/svalboard/split_pause.c'
    - 'keyboards/svalboard/split_pause.h'
    - 'keyboards/svalboard/config.h'
    - 'keyboards/svalboard/tools/make_update.py'
    - 'keyboards/svalboard/tools/sval_update.py'
    - 'keyboards/svalboard/tools/release_version.py'
    - 'keyboards/svalboard/tools/sval_update_TEST_ONLY.key'
    - 'tests/sval_updater/**'
    - 'util/updater_test/**'
    - '.github/workflows/updater-tests.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Host tests (ASan, UBSan)
      run: bash util/updater_test/run.sh
